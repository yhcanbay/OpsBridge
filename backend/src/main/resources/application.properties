spring.application.name=opsbridge
# Maven backend/ dizininden, jar ise kökten de başlatılabilir.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8082}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB:opsbridge}}
spring.datasource.username=${POSTGRES_USER:opsbridge}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
opsbridge.admin.username=${OPSBRIDGE_ADMIN_USERNAME:admin}
opsbridge.admin.password=${OPSBRIDGE_ADMIN_PASSWORD}
opsbridge.github.encryption-key=${OPSBRIDGE_TOKEN_ENCRYPTION_KEY:}
